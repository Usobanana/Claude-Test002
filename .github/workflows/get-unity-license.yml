name: Get Unity License (Run Once)

on:
  workflow_dispatch:

jobs:
  get-license:
    name: Get Unity License File
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity License File
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.4.1f1

      - name: Upload License Request File
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.4.1f1.alf
          path: Unity_v6000.4.1f1.alf
