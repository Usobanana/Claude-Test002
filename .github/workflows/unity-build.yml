name: Unity Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # Windows ビルド（CI）
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: iris/Library
          key: Library-Windows-${{ hashFiles('iris/Assets/**', 'iris/Packages/**', 'iris/ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-
            Library-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:   6000.4.1f1
          targetPlatform: StandaloneWindows64
          projectPath:    iris
          buildsPath:     build
          buildName:      windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows
          path: build/StandaloneWindows64/windows
          retention-days: 14

  # ─────────────────────────────────────────────
  # Android ビルド（CI）
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: iris/Library
          key: Library-Android-${{ hashFiles('iris/Assets/**', 'iris/Packages/**', 'iris/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:   6000.4.1f1
          targetPlatform: Android
          projectPath:    iris
          buildsPath:     build
          buildName:      android

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android/android.apk
          retention-days: 14

  # ─────────────────────────────────────────────
  # GitHub Pages デプロイ（ローカルWebGLビルドを docs/ から配信）
  # ─────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/webgl

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
